minimumReleaseAge: 10080 # 7 days
minimumReleaseAgeExclude:
  - typescript
  - cn
  # TEMPORARY (2026-09-04): allow Vitest 5.0.0 (published 2026-09-03) before it
  # clears the 7-day maturity window (~2026-09-11). Remove after `pnpm install`
  # succeeds without these entries.
  - vitest
  - "@vitest/*"
  - tinybench

trustPolicy: no-downgrade # blocks installs when a package's trust evidence gets weaker than earlier publishes
trustPolicyExclude:
  - semver
  - react-redux
  - reselect
blockExoticSubdeps: true # blocks transitive dependencies from pulling code from exotic sources like git repos or direct tarball URLs
allowBuilds:
  esbuild: true # required by Vite + Wrangler (Oxide)
  workerd: true # required to run Wrangler Pages/Workers locally

# Project-level equivalent:
# pnpm config set --location=project minimumReleaseAge 10080
#
# Global equivalent:
# pnpm config set minimumReleaseAge 10080 --global
